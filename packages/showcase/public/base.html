<!doctype html>
<html class="no-js" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title><%= htmlWebpackPlugin.options.title %></title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#6965db" />
    <meta name="keywords" content="<%= htmlWebpackPlugin.options.keywords %>" />
    <meta
      name="description"
      content="<%= htmlWebpackPlugin.options.description %>" />
    <link rel="canonical" href="<%= htmlWebpackPlugin.options.siteUrl %>" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <!-- The preview of a link to the page, in chats and on social networks -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="react-sketch" />
    <meta property="og:title" content="<%= htmlWebpackPlugin.options.title %>" />
    <meta
      property="og:description"
      content="<%= htmlWebpackPlugin.options.description %>" />
    <meta property="og:url" content="<%= htmlWebpackPlugin.options.siteUrl %>" />
    <meta
      property="og:image"
      content="<%= htmlWebpackPlugin.options.siteUrl %>og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The brush of the react-sketch logo, and the title react-sketch Showcase" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="<%= htmlWebpackPlugin.options.title %>" />
    <meta
      name="twitter:description"
      content="<%= htmlWebpackPlugin.options.description %>" />
    <meta
      name="twitter:image"
      content="<%= htmlWebpackPlugin.options.siteUrl %>og-image.png" />
  </head>
  <body>
    <div id="container"></div>
  </body>
</html>
