name: CI

on:
  push:
    branches: [master, "release/*.*.*", "hotfix/*.*.*"]
  pull_request:
    branches: [master, "release/*.*.*", "hotfix/*.*.*"]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn format:check
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn build
      - run: yarn test
      - name: Test with React 18
        run: yarn test
        env:
          REACT: "18"
