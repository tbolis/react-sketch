name: Deploy showcase to GitHub Pages

# Builds the showcase from the sources of this repository (the react-sketch library, the
# @react-sketch/* packages and the showcase itself) and publishes it with GitHub Pages.
# It runs when one of them changes on main, and on demand from the Actions tab.
#
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "!packages/**/*.md"
      - "package.json"
      - "yarn.lock"
      - ".nvmrc"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish, and keep only the latest one waiting
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
      - uses: actions/configure-pages@v6
      - run: yarn install --frozen-lockfile
      # The library imports the built @react-sketch/* packages
      - run: yarn build:packages
      # The showcase is built against the sources of react-sketch (webpack alias)
      - run: yarn workspace showcase build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: packages/showcase/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
